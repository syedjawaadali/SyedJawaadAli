<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Syed Jawaad Ali - Data, Analytics and Business Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A14"/>
      <stop offset="0.55" stop-color="#0A1122"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1E90FF"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#4F7DFF"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ecbff"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1E90FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E90FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C2A8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00C2A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="120" cy="40" r="260" fill="url(#glowB)"/>
  <circle cx="1120" cy="300" r="260" fill="url(#glowT)"/>

  <!-- isometric grid for depth -->
  <g stroke="#1b2740" stroke-width="1" opacity="0.5">
    <path d="M0 120 L1200 40"/>
    <path d="M0 170 L1200 90"/>
    <path d="M0 220 L1200 140"/>
    <path d="M0 270 L1200 190"/>
    <path d="M0 320 L1200 240"/>
    <path d="M150 0 L150 320"/><path d="M330 0 L330 320"/><path d="M510 0 L510 320"/>
    <path d="M690 0 L690 320"/><path d="M870 0 L870 320"/><path d="M1050 0 L1050 320"/>
  </g>

  <!-- left: identity -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="118" font-size="19" letter-spacing="6" fill="#38BDF8" font-weight="600">DATA · ANALYTICS · BI</text>
    <text x="60" y="182" font-size="62" font-weight="800" fill="url(#name)">Syed Jawaad Ali</text>
    <text x="64" y="224" font-size="22" fill="#93a4c0" font-weight="500">Business Intelligence &amp; Data Engineering · Power BI Trainer</text>
    <g transform="translate(64,258)">
      <rect width="196" height="34" rx="17" fill="none" stroke="#1E90FF" stroke-opacity="0.6"/>
      <text x="98" y="23" font-size="15" fill="#cfe0ff" text-anchor="middle" font-weight="600">Scattered data → clear decisions</text>
    </g>
  </g>

  <!-- right: floating isometric BI cards -->
  <g transform="translate(900,160)" filter="url(#soft)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 0 -8; 0 0" dur="6s" repeatCount="indefinite"/>

    <!-- back card: line trend -->
    <g transform="translate(70,-70) skewY(-18)">
      <rect x="0" y="0" width="150" height="96" rx="10" fill="#0f1b30" stroke="#25406b"/>
      <polyline points="14,74 42,54 70,62 98,32 134,20" fill="none" stroke="url(#violet)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="134" cy="20" r="4" fill="#7C5CFF"/>
    </g>

    <!-- mid card: bars -->
    <g transform="translate(0,-24) skewY(-18)">
      <rect x="0" y="0" width="150" height="96" rx="10" fill="#122038" stroke="#2b4a7a"/>
      <rect x="18" y="52" width="18" height="30" rx="3" fill="url(#blue)"/>
      <rect x="48" y="38" width="18" height="44" rx="3" fill="url(#blue)"/>
      <rect x="78" y="46" width="18" height="36" rx="3" fill="url(#teal)"/>
      <rect x="108" y="26" width="18" height="56" rx="3" fill="url(#teal)"/>
    </g>

    <!-- front card: KPI + donut -->
    <g transform="translate(-70,22) skewY(-18)">
      <rect x="0" y="0" width="150" height="96" rx="10" fill="#16233d" stroke="#325089"/>
      <text x="16" y="34" font-size="13" fill="#8aa0c4" font-family="'Segoe UI',Arial,sans-serif">Revenue</text>
      <text x="16" y="60" font-size="24" font-weight="800" fill="#ffffff" font-family="'Segoe UI',Arial,sans-serif">$26.9M</text>
      <text x="16" y="80" font-size="12" fill="#2DD4BF" font-family="'Segoe UI',Arial,sans-serif">▲ 23.5% YoY</text>
      <circle cx="118" cy="52" r="22" fill="none" stroke="#24324d" stroke-width="7"/>
      <circle cx="118" cy="52" r="22" fill="none" stroke="url(#teal)" stroke-width="7"
              stroke-dasharray="104 138" stroke-linecap="round" transform="rotate(-90 118 52)"/>
    </g>
  </g>
</svg>
