<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 195" width="480" height="195" role="img" aria-label="At a glance">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E90FF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C2A8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#4F7DFF"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5A524"/><stop offset="1" stop-color="#f7b955"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="194" rx="12" fill="url(#sbg)" stroke="#26324a"/>
  <text x="20" y="30" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">At a glance</text>
  <line x1="20" y1="40" x2="460" y2="40" stroke="#1c2842"/>

  <!-- left: KPI tiles -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="20" y="72" font-size="26" font-weight="800" fill="#38BDF8">6+</text>
    <text x="20" y="88" font-size="11" fill="#8aa0c4">years experience</text>

    <text x="130" y="72" font-size="26" font-weight="800" fill="#2DD4BF">30+</text>
