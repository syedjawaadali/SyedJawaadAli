    <text x="262" y="128">Analytics &amp; ML</text>
    <rect x="262" y="134" width="180" height="8" rx="4" fill="#1a2740"/>
    <rect x="262" y="134" width="132" height="8" rx="4" fill="url(#b3)"/>

    <text x="262" y="160">Web &amp; Apps</text>
