<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" role="img" aria-label="Syed Jawaad Ali - LinkedIn banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A14"/><stop offset="0.55" stop-color="#0A1122"/><stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#1E90FF"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#00C2A8"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#4F7DFF"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9ecbff"/></linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1E90FF" stop-opacity="0.45"/><stop offset="1" stop-color="#1E90FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00C2A8" stop-opacity="0.45"/><stop offset="1" stop-color="#00C2A8" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <circle cx="120" cy="60" r="360" fill="url(#glowB)"/>
  <circle cx="1500" cy="380" r="380" fill="url(#glowT)"/>

  <g stroke="#1b2740" stroke-width="1" opacity="0.5">
    <path d="M0 150 L1584 60"/><path d="M0 230 L1584 140"/><path d="M0 310 L1584 220"/><path d="M0 390 L1584 300"/>
    <path d="M260 0 L260 396"/><path d="M520 0 L520 396"/><path d="M780 0 L780 396"/><path d="M1040 0 L1040 396"/><path d="M1300 0 L1300 396"/>
  </g>

  <!-- text block (kept right of the avatar zone at bottom-left) -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="332" y="120" font-size="19" letter-spacing="6" fill="#38BDF8" font-weight="600">DATA · ANALYTICS · BUSINESS INTELLIGENCE</text>
    <text x="330" y="182" font-size="46" font-weight="800" fill="url(#name)">Turning data into clear decisions</text>
    <text x="332" y="222" font-size="23" fill="#93a4c0" font-weight="500">BI &amp; Data Engineering  ·  Power BI &amp; Excel Trainer</text>

    <g font-size="17" font-weight="600">
      <g transform="translate(332,258)">
        <rect width="168" height="40" rx="20" fill="#0f1b30" stroke="#2b4a7a"/>
        <text x="84" y="26" fill="#cfe0ff" text-anchor="middle">Power BI · DAX</text>
      </g>
      <g transform="translate(512,258)">
        <rect width="182" height="40" rx="20" fill="#0f1b30" stroke="#2b6a5a"/>
        <text x="91" y="26" fill="#c7f5ec" text-anchor="middle">Dashboards · ETL</text>
      </g>
      <g transform="translate(706,258)">
        <rect width="200" height="40" rx="20" fill="#0f1b30" stroke="#4b4a8a"/>
        <text x="100" y="26" fill="#dcd6ff" text-anchor="middle">Python · SQL · Excel</text>
      </g>
    </g>

    <text x="332" y="342" font-size="18" font-weight="700" fill="#e6edf3">github.com/syedjawaadali</text>
  </g>

  <!-- isometric BI cards on the right -->
  <g transform="translate(1330,205) scale(1.02)" filter="url(#soft)">
    <g transform="translate(70,-70) skewY(-18)">
      <rect x="0" y="0" width="150" height="96" rx="10" fill="#0f1b30" stroke="#25406b"/>
      <polyline points="14,74 42,54 70,62 98,32 134,20" fill="none" stroke="url(#violet)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="134" cy="20" r="4" fill="#7C5CFF"/>
    </g>
    <g transform="translate(0,-24) skewY(-18)">
      <rect x="0" y="0" width="150" height="96" rx="10" fill="#122038" stroke="#2b4a7a"/>
      <rect x="18" y="52" width="18" height="30" rx="3" fill="url(#blue)"/>
      <rect x="48" y="38" width="18" height="44" rx="3" fill="url(#blue)"/>
      <rect x="78" y="46" width="18" height="36" rx="3" fill="url(#teal)"/>
      <rect x="108" y="26" width="18" height="56" rx="3" fill="url(#teal)"/>
